    <!-- Applies the saved accessibility theme before the first paint (no flash). -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem("aa-theme")
          var contrast = saved ? saved === "contrast" : matchMedia("(prefers-contrast: more)").matches
          if (contrast) document.documentElement.setAttribute("data-theme", "contrast")
        } catch (e) {}
      })()
    </script>
