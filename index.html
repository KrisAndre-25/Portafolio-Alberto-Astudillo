<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alberto Astudillo · Guardaparque en Torres del Paine</title>
    <meta
      name="description"
      content="Portafolio de Alberto Astudillo, guardaparque en Las Torres Patagonia y Técnico en Turismo Aventura. Experiencia en parques, senderos, primeros auxilios en lugares remotos y corridas de montaña."
    />
    <meta name="theme-color" content="#121a15" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="Alberto Astudillo · Guardaparque en Torres del Paine" />
    <meta
      property="og:description"
      content="Guardaparque en Las Torres Patagonia, Técnico en Turismo Aventura y corredor de montaña."
    />
    <meta property="og:image" content="/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Hero fonts: fetched with the HTML instead of after the CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" />

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo/logo-192.png" />
    <link rel="apple-touch-icon" href="/assets/logo/logo-180.png" />

    <!-- Applies the saved accessibility theme before the first paint (no flash). -->
    <script>
      ;(function () {
        document.documentElement.classList.add("js")
        try {
          var saved = localStorage.getItem("aa-theme")
          var contrast = saved ? saved === "contrast" : matchMedia("(prefers-contrast: more)").matches
          if (contrast) document.documentElement.setAttribute("data-theme", "contrast")
        } catch (e) {}
      })()
    </script>
    <!-- Loading screen (from referencias/spinner-loader.tsx), theme colours. -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: var(--background, #121a15);
        color: var(--foreground, #f1ece2);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .is-loaded #loader {
        opacity: 0;
        visibility: hidden;
      }
      #loader .loader-ring {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100px;
        height: 100px;
      }
      #loader .loader-ring::after {
        content: "";
        box-sizing: content-box;
        width: 75px;
        height: 75px;
        border: 15px solid color-mix(in oklch, var(--foreground, #f1ece2) 16%, transparent);
        border-top-color: var(--moss, #46c380);
        border-radius: 50%;
        animation: loading 0.75s ease-out infinite;
      }
      #loader .loader-name {
        font: 500 0.75rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      @keyframes loading {
        from { transform: rotate(0turn); }
        to { transform: rotate(1turn); }
      }
      /* The hero entrance waits until the loading screen is gone. */
      html:not(.is-loaded) .hero-enter,
      html:not(.is-loaded) .hero-enter-slide {
        animation-play-state: paused;
      }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body class="grain">
    <div id="loader" role="status">
      <div class="loader-ring" aria-hidden="true"></div>
      <span class="loader-name">Alberto Astudillo</span>
      <span class="sr-only">Cargando el sitio…</span>
    </div>
    <script>
      // Hide the loading screen once the hero's fonts and poster are ready (3s at most).
      ;(function () {
        var root = document.documentElement
        var done = function () { root.classList.add("is-loaded") }
        setTimeout(done, 3000)
        document.addEventListener("DOMContentLoaded", function () {
          var poster = document.querySelector("#inicio img")
          var img = poster && !poster.complete
            ? new Promise(function (r) { poster.addEventListener("load", r, { once: true }); poster.addEventListener("error", r, { once: true }) })
            : Promise.resolve()
          var fonts = document.fonts ? document.fonts.ready : Promise.resolve()
          Promise.all([img, fonts]).then(function () { setTimeout(done, 250) })
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
